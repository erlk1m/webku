[package]
name = "meting-api-worker"
version = "0.1.0"
edition = "2021"
description = "High-performance Meting Music API built with Rust WebAssembly for Cloudflare Workers"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
